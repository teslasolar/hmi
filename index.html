<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISA-95 L2 HMI</title>
  <style>
    /* ===== BASE STYLES ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font: 14px 'Courier New', monospace;
      overflow: hidden;
    }

    /* ===== LAYOUT ===== */
    #hmi {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f0;
      height: 50px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .isa-level {
      font-size: 12px;
      color: #0f0;
      opacity: 0.7;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #status {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0f0;
      animation: pulse 1s infinite;
      box-shadow: 0 0 10px #0f0;
    }

    #status.disconnected {
      background: #f00;
      animation: pulse-red 1s infinite;
      box-shadow: 0 0 10px #f00;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timestamp {
      font-size: 12px;
      opacity: 0.8;
    }

    /* ===== CONTAINER GRID ===== */
    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .panel {
      background: #111;
      border: 2px solid #0f0;
      padding: 15px;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #0f0;
      opacity: 0.8;
    }

    /* ===== GAUGES ===== */
    #gauges {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
      align-items: center;
    }

    .gauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px;
    }

    .gauge .label {
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
    }

    .gauge canvas {
      border: 1px solid #0f0;
      border-radius: 5px;
      background: #000;
    }

    .gauge .value {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #0f0;
    }

    .gauge .units {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* ===== TRENDS ===== */
    #trends {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .trend {
      display: flex;
      flex-direction: column;
    }

    .trend .label {
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
    }

    .trend canvas {
      border: 1px solid #0f0;
      background: #000;
      width: 100%;
    }

    /* ===== CONTROLS ===== */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .control-group-title {
      width: 100%;
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .hmi-btn {
      background: #333;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 12px 24px;
      cursor: pointer;
      font: 14px 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      flex: 1;
      min-width: 120px;
    }

    .hmi-btn:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 10px #0f0;
    }

    .hmi-btn:active {
      transform: scale(0.98);
    }

    .hmi-btn.active {
      background: #0f0;
      color: #000;
    }

    .hmi-btn.danger {
      border-color: #f00;
      color: #f00;
    }

    .hmi-btn.danger:hover {
      background: #f00;
      color: #000;
      box-shadow: 0 0 10px #f00;
    }

    /* ===== ALARMS ===== */
    #alarms {
      flex: 1;
      overflow-y: auto;
    }

    .alarm-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .alarm {
      padding: 8px 12px;
      border-left: 4px solid;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(-10px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .alarm.high {
      border-color: #f00;
      background: #300;
      color: #f00;
    }

    .alarm.med {
      border-color: #ff0;
      background: #330;
      color: #ff0;
    }

    .alarm.low {
      border-color: #0f0;
      background: #030;
      color: #0f0;
    }

    .alarm-time {
      opacity: 0.7;
      font-size: 11px;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #0f0;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0f0;
      box-shadow: 0 0 5px #0f0;
    }

    /* ===== FOOTER ===== */
    .footer {
      background: #111;
      padding: 8px 20px;
      border-top: 2px solid #0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.7;
      height: 30px;
    }

    .plc-info {
      display: flex;
      gap: 20px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      #gauges {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <div id="hmi">
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="header-title">⚡ HMI SUPERVISOR</div>
        <div class="isa-level">ISA-95 L2 | SCADA</div>
      </div>
      <div class="header-right">
        <div class="timestamp" id="timestamp">--:--:--</div>
        <div id="status" class="disconnected" title="Connection Status"></div>
      </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">
      <!-- GAUGES PANEL -->
      <div class="panel">
        <div class="panel-title">📊 ANALOG INPUTS</div>
        <div id="gauges"></div>
      </div>

      <!-- TRENDS PANEL -->
      <div class="panel">
        <div class="panel-title">📈 TREND CHARTS</div>
        <div id="trends"></div>
      </div>

      <!-- CONTROLS PANEL -->
      <div class="panel">
        <div class="panel-title">🎮 CONTROLS</div>
        <div id="controls"></div>
      </div>

      <!-- ALARMS PANEL -->
      <div class="panel">
        <div class="panel-title">🚨 ALARM LOG</div>
        <div id="alarms"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="plc-info">
        <span>PLC: <span id="plc-vendor">--</span></span>
        <span>State: <span id="plc-state">--</span></span>
        <span>Scan: <span id="scan-time">--</span>ms</span>
      </div>
      <div>HMI v1.0 | MIT License</div>
    </div>
  </div>

  <script>
    // ===== CONFIGURATION =====
    const CONFIG = {
      plcUrl: 'https://teslasolar.github.io/plc/',  // PLC iframe URL
      pollRate: 100,                                 // Poll rate in ms
      enableSimulation: true,                        // Fallback simulation mode
      gauges: [
        { label: 'Temperature', min: 0, max: 100, units: '°C', aiIndex: 0 },
        { label: 'Pressure', min: 0, max: 10, units: 'bar', aiIndex: 1 }
      ],
      trends: [
        { label: 'Flow Rate', points: 50, units: 'L/min', aiIndex: 2 },
        { label: 'Power', points: 50, units: 'kW', aiIndex: 3 }
      ],
      controlButtons: [
        { group: 'System Control', buttons: [
          { label: 'START', action: 'start', addr: 1, tag: 'state', value: 'EXECUTE' },
          { label: 'STOP', action: 'stop', addr: 1, tag: 'state', value: 'STOPPED' },
          { label: 'E-STOP', action: 'estop', addr: 1, tag: 'state', value: 'ABORTED', danger: true }
        ]},
        { group: 'Process Control', buttons: [
          { label: 'RESET', action: 'reset', addr: 1, tag: 'state', value: 'IDLE' },
          { label: 'PAUSE', action: 'pause', addr: 1, tag: 'state', value: 'HELD' }
        ]}
      ]
    };

    // ===== PLC BRIDGE CLASS =====
    class PLCBridge {
      constructor(url) {
        this.url = url;
        this.iframe = null;
        this.data = null;
        this.callbacks = [];
        this.connected = false;
        this.simulationMode = CONFIG.enableSimulation;
        this.simData = this.initSimData();

        if (url) {
          this.initIframe();
        } else {
          console.warn('No PLC URL provided, running in simulation mode');
          this.startSimulation();
        }
      }

      initIframe() {
        this.iframe = document.createElement('iframe');
        this.iframe.src = this.url;
        this.iframe.style.display = 'none';
        document.body.appendChild(this.iframe);

        window.addEventListener('message', e => {
          if (e.origin === new URL(this.url).origin) {
            this.data = e.data;
            this.connected = true;
            this.updateConnectionStatus(true);
            this.callbacks.forEach(cb => cb(this.data));
          }
        });

        // Fallback to simulation if no response
        setTimeout(() => {
          if (!this.connected && this.simulationMode) {
            console.warn('PLC not responding, switching to simulation mode');
            this.startSimulation();
          }
        }, 2000);
      }

      initSimData() {
        return {
          plcs: [{
            vendor: 'Generic PLC',
            state: 'IDLE',
            addr: 1,
            io: {
              AI: [0, 0, 0, 0, 0, 0, 0, 0],
              DI: new Array(16).fill(false),
              DO: new Array(16).fill(false),
              AO: new Array(8).fill(0)
            },
            tags: {},
            scanTime: 100
          }]
        };
      }

      startSimulation() {
        this.connected = true;
        this.updateConnectionStatus(true);

        setInterval(() => {
          // Simulate realistic analog values
          const time = Date.now() / 1000;
          this.simData.plcs[0].io.AI[0] = 20 + Math.sin(time) * 30 + Math.random() * 10;        // Temp
          this.simData.plcs[0].io.AI[1] = 5 + Math.sin(time / 2) * 3 + Math.random() * 2;      // Pressure
          this.simData.plcs[0].io.AI[2] = 50 + Math.cos(time / 1.5) * 30 + Math.random() * 20; // Flow
          this.simData.plcs[0].io.AI[3] = 75 + Math.sin(time / 3) * 20 + Math.random() * 10;   // Power

          this.data = this.simData;
          this.callbacks.forEach(cb => cb(this.data));
        }, CONFIG.pollRate);
      }

      request() {
        if (this.iframe && this.iframe.contentWindow) {
          this.iframe.contentWindow.postMessage({ cmd: 'getData' }, '*');
        }
      }

      subscribe(callback) {
        this.callbacks.push(callback);
        if (!this.simulationMode && this.iframe) {
          setInterval(() => this.request(), CONFIG.pollRate);
        }
      }

      write(addr, tag, value) {
        if (this.iframe && this.iframe.contentWindow) {
          this.iframe.contentWindow.postMessage({
            cmd: 'write',
            addr: addr,
            tag: tag,
            val: value
          }, '*');
        } else if (this.simulationMode) {
          // Update simulation data
          const plc = this.simData.plcs.find(p => p.addr === addr);
          if (plc) {
            plc.state = value;
            console.log(`[SIM] PLC ${addr} ${tag} = ${value}`);
          }
        }
      }

      updateConnectionStatus(connected) {
        const statusEl = document.getElementById('status');
        if (connected) {
          statusEl.classList.remove('disconnected');
        } else {
          statusEl.classList.add('disconnected');
        }
      }
    }

    // ===== GAUGE WIDGET CLASS =====
    class Gauge {
      constructor(parent, config) {
        this.config = config;
        this.value = 0;

        // Create container
        this.el = document.createElement('div');
        this.el.className = 'gauge';

        // Label
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = config.label;
        this.el.appendChild(label);

        // Canvas
        this.canvas = document.createElement('canvas');
        this.canvas.width = 150;
        this.canvas.height = 150;
        this.el.appendChild(this.canvas);
        this.ctx = this.canvas.getContext('2d');

        // Value display
        this.valueEl = document.createElement('div');
        this.valueEl.className = 'value';
        this.valueEl.textContent = '0.0';
        this.el.appendChild(this.valueEl);

        // Units
        const units = document.createElement('div');
        units.className = 'units';
        units.textContent = config.units || '';
        this.el.appendChild(units);

        parent.appendChild(this.el);
        this.draw(0);
      }

      update(value) {
        this.value = value;
        this.valueEl.textContent = value.toFixed(1);
        this.draw(value);
      }

      draw(value) {
        const { min, max } = this.config;
        const centerX = 75;
        const centerY = 75;
        const radius = 60;

        // Clear canvas
        this.ctx.clearRect(0, 0, 150, 150);

        // Background arc
        this.ctx.strokeStyle = '#333';
        this.ctx.lineWidth = 12;
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, radius, Math.PI * 0.75, Math.PI * 2.25);
        this.ctx.stroke();

        // Value arc
        const angle = Math.PI * 0.75 + ((value - min) / (max - min)) * Math.PI * 1.5;
        this.ctx.strokeStyle = this.getColor(value);
        this.ctx.lineWidth = 12;
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, radius, Math.PI * 0.75, angle);
        this.ctx.stroke();

        // Needle
        const needleAngle = angle - Math.PI / 2;
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 3;
        this.ctx.beginPath();
        this.ctx.moveTo(centerX, centerY);
        this.ctx.lineTo(
          centerX + Math.cos(needleAngle) * (radius - 10),
          centerY + Math.sin(needleAngle) * (radius - 10)
        );
        this.ctx.stroke();

        // Center dot
        this.ctx.fillStyle = '#fff';
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
        this.ctx.fill();
      }

      getColor(value) {
        const { min, max } = this.config;
        const percent = (value - min) / (max - min);

        if (percent > 0.9) return '#f00';
        if (percent > 0.75) return '#ff0';
        return '#0f0';
      }
    }

    // ===== TREND WIDGET CLASS =====
    class Trend {
      constructor(parent, config) {
        this.config = config;
        this.data = new Array(config.points).fill(0);
        this.max = 100;

        // Create container
        this.el = document.createElement('div');
        this.el.className = 'trend';

        // Label
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${config.label} (${config.units || ''})`;
        this.el.appendChild(label);

        // Canvas
        this.canvas = document.createElement('canvas');
        this.canvas.width = 400;
        this.canvas.height = 100;
        this.el.appendChild(this.canvas);
        this.ctx = this.canvas.getContext('2d');

        parent.appendChild(this.el);
        this.draw();
      }

      push(value) {
        this.data.shift();
        this.data.push(value);

        // Auto-scale
        this.max = Math.max(...this.data) * 1.2 || 100;

        this.draw();
      }

      draw() {
        const width = this.canvas.width;
        const height = this.canvas.height;

        // Clear
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(0, 0, width, height);

        // Grid
        this.ctx.strokeStyle = '#222';
        this.ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = (i / 4) * height;
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(width, y);
          this.ctx.stroke();
        }

        // Line
        this.ctx.strokeStyle = '#0f0';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();

        this.data.forEach((value, i) => {
          const x = (i / (this.data.length - 1)) * width;
          const y = height - (value / this.max) * height;

          if (i === 0) {
            this.ctx.moveTo(x, y);
          } else {
            this.ctx.lineTo(x, y);
          }
        });

        this.ctx.stroke();

        // Current value text
        this.ctx.fillStyle = '#0f0';
        this.ctx.font = '12px Courier New';
        this.ctx.fillText(
          `${this.data[this.data.length - 1].toFixed(1)}`,
          width - 50,
          20
        );
      }
    }

    // ===== BUTTON WIDGET CLASS =====
    class Button {
      constructor(parent, config, onClick) {
        this.config = config;
        this.active = false;

        this.el = document.createElement('button');
        this.el.className = 'hmi-btn';
        if (config.danger) {
          this.el.classList.add('danger');
        }
        this.el.textContent = config.label;
        this.el.onclick = () => onClick(config);

        parent.appendChild(this.el);
      }

      setState(active) {
        this.active = active;
        if (active) {
          this.el.classList.add('active');
        } else {
          this.el.classList.remove('active');
        }
      }
    }

    // ===== ALARM WIDGET CLASS =====
    class Alarm {
      constructor(parent) {
        this.el = document.createElement('div');
        this.el.className = 'alarm-list';
        this.alarms = [];
        parent.appendChild(this.el);
      }

      add(message, severity = 'low') {
        const alarm = {
          msg: message,
          time: new Date().toLocaleTimeString(),
          sev: severity
        };

        this.alarms.unshift(alarm);

        if (this.alarms.length > 100) {
          this.alarms.pop();
        }

        this.render();
      }

      render() {
        this.el.innerHTML = this.alarms.map(a => `
          <div class="alarm ${a.sev}">
            <span>${a.msg}</span>
            <span class="alarm-time">${a.time}</span>
          </div>
        `).join('');
      }

      clear() {
        this.alarms = [];
        this.render();
      }
    }

    // ===== HMI SCREEN CLASS =====
    class HMIScreen {
      constructor() {
        this.widgets = {
          gauges: [],
          trends: [],
          buttons: [],
          alarms: null
        };

        this.createWidgets();
        this.startClock();
      }

      createWidgets() {
        // Create gauges
        const gaugesContainer = document.getElementById('gauges');
        CONFIG.gauges.forEach(config => {
          const gauge = new Gauge(gaugesContainer, config);
          this.widgets.gauges.push({ widget: gauge, config });
        });

        // Create trends
        const trendsContainer = document.getElementById('trends');
        CONFIG.trends.forEach(config => {
          const trend = new Trend(trendsContainer, config);
          this.widgets.trends.push({ widget: trend, config });
        });

        // Create control buttons
        const controlsContainer = document.getElementById('controls');
        CONFIG.controlButtons.forEach(group => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'control-group';

          const groupTitle = document.createElement('div');
          groupTitle.className = 'control-group-title';
          groupTitle.textContent = group.group;
          groupDiv.appendChild(groupTitle);

          group.buttons.forEach(btnConfig => {
            const button = new Button(groupDiv, btnConfig, (config) => {
              this.handleButtonClick(config);
            });
            this.widgets.buttons.push({ widget: button, config: btnConfig });
          });

          controlsContainer.appendChild(groupDiv);
        });

        // Create alarm list
        this.widgets.alarms = new Alarm(document.getElementById('alarms'));
      }

      handleButtonClick(config) {
        console.log(`Button clicked: ${config.label}`);

        // Send command to PLC
        if (window.plcBridge) {
          window.plcBridge.write(config.addr, config.tag, config.value);
        }

        // Log alarm
        const severity = config.danger ? 'high' : config.action === 'stop' ? 'med' : 'low';
        this.widgets.alarms.add(`${config.label} command sent`, severity);
      }

      updateData(data) {
        if (!data || !data.plcs || data.plcs.length === 0) return;

        const plc = data.plcs[0];

        // Update gauges
        this.widgets.gauges.forEach(({ widget, config }) => {
          const value = plc.io.AI[config.aiIndex] || 0;
          widget.update(value);

          // Alarm on high values
          if (value > config.max * 0.9) {
            this.widgets.alarms.add(
              `${config.label} high: ${value.toFixed(1)} ${config.units}`,
              'high'
            );
          }
        });

        // Update trends
        this.widgets.trends.forEach(({ widget, config }) => {
          const value = plc.io.AI[config.aiIndex] || 0;
          widget.push(value);
        });

        // Update footer info
        document.getElementById('plc-vendor').textContent = plc.vendor || 'Unknown';
        document.getElementById('plc-state').textContent = plc.state || 'IDLE';
        document.getElementById('scan-time').textContent = plc.scanTime || CONFIG.pollRate;

        // Check for fault states
        if (plc.state === 'ABORTED') {
          this.widgets.alarms.add('PLC in ABORTED state', 'high');
        }
      }

      startClock() {
        setInterval(() => {
          const now = new Date();
          document.getElementById('timestamp').textContent = now.toLocaleTimeString();
        }, 1000);
      }
    }

    // ===== INITIALIZATION =====
    window.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 ISA-95 L2 HMI Initializing...');

      // Create HMI
      const hmi = new HMIScreen();
      hmi.widgets.alarms.add('HMI System initialized', 'low');

      // Create PLC Bridge
      const plcBridge = new PLCBridge(CONFIG.plcUrl);
      window.plcBridge = plcBridge;

      // Subscribe to PLC data
      plcBridge.subscribe(data => {
        hmi.updateData(data);
      });

      console.log('✅ HMI Ready');
      console.log(`📡 PLC URL: ${CONFIG.plcUrl || 'SIMULATION MODE'}`);
