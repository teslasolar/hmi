<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISA-95 L2 HMI</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- HMI Container -->
  <div id="hmi">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-title">⚡ HMI SUPERVISOR</div>
        <div class="isa-level">ISA-95 L2 | SCADA</div>
      </div>
      <div class="header-right">
        <div class="timestamp" id="timestamp">--:--:--</div>
        <div id="status" class="disconnected" title="Connection Status"></div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="container">

      <!-- Gauges Panel -->
      <div class="panel">
        <div class="panel-title">📊 ANALOG INPUTS</div>
        <div id="gauges"></div>
      </div>

      <!-- Trends Panel -->
      <div class="panel">
        <div class="panel-title">📈 TREND CHARTS</div>
        <div id="trends"></div>
      </div>

      <!-- Controls Panel -->
      <div class="panel">
        <div class="panel-title">🎮 CONTROLS</div>
        <div id="controls"></div>
      </div>

      <!-- Alarms Panel -->
      <div class="panel">
        <div class="panel-title">🚨 ALARM LOG</div>
        <div id="alarms"></div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="plc-info">
        <span>PLC: <span id="plc-vendor">--</span></span>
        <span>State: <span id="plc-state">--</span></span>
        <span>Scan: <span id="scan-time">--</span>ms</span>
      </div>
      <div>HMI v1.0 | MIT License</div>
    </div>

  </div>

  <!-- Configuration -->
  <script src="config.js"></script>

  <!-- Core Modules -->
  <script type="module" src="core/app.js"></script>
</body>
</html>
